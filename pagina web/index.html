<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ProMusic - Acceso y Registro</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap&quot; rel="stylesheet">
<style>
body {
font-family: 'Montserrat', sans-serif;
background-color: #fcf9f5;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
margin: 0;
}
.auth-card {
background: white;
padding: 35px;
border-radius: 12px;
box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
width: 360px;
text-align: center;
border: 1px solid #f0e6dc;
}
h1 {
color: #ff7b7b;
margin: 5px 0;
font-weight: 700;
font-size: 28px;
}
p {
color: #666;
font-size: 13px;
margin-bottom: 20px;
font-weight: 300;
}
.tabs {
display: flex;
gap: 10px;
margin-bottom: 20px;
}
.tab-btn {
flex: 1;
padding: 8px;
border: 1px solid #ff7b7b;
background: transparent;
color: #ff7b7b;
border-radius: 6px;
cursor: pointer;
font-family: 'Montserrat', sans-serif;
font-weight: 600;
font-size: 13px;
}
.tab-btn.active {
background: #ff7b7b;
color: white;
}
input {
width: 100%;
padding: 12px;
margin: 8px 0;
border: 1px solid #ddd;
border-radius: 6px;
box-sizing: border-box;
font-family: 'Montserrat', sans-serif;
font-size: 14px;
}
.submit-btn {
background-color: #ff7b7b;
color: white;
border: none;
padding: 12px;
width: 100%;
border-radius: 6px;
cursor: pointer;
font-size: 15px;
font-weight: 600;
margin-top: 10px;
font-family: 'Montserrat', sans-serif;
}
.submit-btn:hover { background-color: #e56a6a; }
.mensaje {
font-size: 13px;
margin-top: 12px;
min-height: 18px;
}
.error { color: #dc3545; }
.exito { color: #28a745; }
#registro-form { display: none; }
</style>
</head>
<body>

<div class="auth-card">
<h1>ProMusic</h1>
<p>Accede o crea tu cuenta para el curso</p>

<div class="tabs">
<button type="button" id="tab-login" class="tab-btn active" onclick="cambiarVista('login')">Iniciar Sesión</button>
<button type="button" id="tab-registro" class="tab-btn" onclick="cambiarVista('registro')">Registrarse</button>
</div>

<!-- Formulario de Inicio de Sesión -->
<div id="login-form">
<input type="text" id="login-usuario" placeholder="Usuario">
<input type="password" id="login-password" placeholder="Contraseña">
<button type="button" class="submit-btn" onclick="iniciarSesion()">Ingresar</button>
</div>

<!-- Formulario de Registro -->
<div id="registro-form">
<input type="text" id="reg-usuario" placeholder="Crea un nombre de usuario">
<input type="password" id="reg-password" placeholder="Crea una contraseña">
<button type="button" class="submit-btn" onclick="registrarUsuario()">Crear Cuenta</button>
</div>

<div id="mensaje" class="mensaje"></div>
</div>

<script>
function cambiarVista(vista) {
const loginForm = document.getElementById("login-form");
const registroForm = document.getElementById("registro-form");
const tabLogin = document.getElementById("tab-login");
const tabRegistro = document.getElementById("tab-registro");
const mensaje = document.getElementById("mensaje");

mensaje.innerText = "";
mensaje.className = "mensaje";

if (vista === "login") {
loginForm.style.display = "block";
registroForm.style.display = "none";
tabLogin.classList.add("active");
tabRegistro.classList.remove("active");
} else {
loginForm.style.display = "none";
registroForm.style.display = "block";
tabRegistro.classList.add("active");
tabLogin.classList.remove("active");
}
}

function registrarUsuario() {
const nuevoUser = document.getElementById("reg-usuario").value.trim();
const nuevoPass = document.getElementById("reg-password").value.trim();
const mensaje = document.getElementById("mensaje");

if (nuevoUser === "" || nuevoPass === "") {
mensaje.innerText = "Completa ambos campos para registrarte.";
mensaje.className = "mensaje error";
return;
}

// Guardamos el usuario y contraseña en el navegador
localStorage.setItem("promusic_user", nuevoUser);
localStorage.setItem("promusic_pass", nuevoPass);

mensaje.innerText = "¡Cuenta creada! Ya puedes iniciar sesión.";
mensaje.className = "mensaje exito";

document.getElementById("reg-usuario").value = "";
document.getElementById("reg-password").value = "";
}

function iniciarSesion() {
const userInput = document.getElementById("login-usuario").value.trim();
const passInput = document.getElementById("login-password").value.trim();
const mensaje = document.getElementById("mensaje");

const userGuardado = localStorage.getItem("promusic_user");
const passGuardada = localStorage.getItem("promusic_pass");

// Permite entrar con la cuenta registrada o con la cuenta de prueba alumno/1234
const esCuentaRegistrada = userGuardado && userInput === userGuardado && passInput === passGuardada;
const esCuentaDemo = userInput === "alumno" && passInput === "1234";

if (esCuentaRegistrada || esCuentaDemo) {
window.location.href = "curso.html";
} else {
mensaje.innerText = "Usuario o contraseña incorrectos.";
mensaje.className = "mensaje error";
}
}
</script>

</body>
</html>
