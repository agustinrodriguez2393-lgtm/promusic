<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ProMusic - Inicio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #fcf9f5;
            margin: 0;
            display: flex;
            height: 100vh;
        }
        sidebar {
            width: 220px;
            background-color: #ffffff;
            border-right: 1px solid #eaeaea;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .logo-area {
            font-weight: 700;
            font-size: 20px;
            color: #333;
            margin-bottom: 30px;
        }
        .menu-link {
            text-decoration: none;
            color: #333;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        .menu-link.active, .menu-link:hover {
            background-color: #f1f3f5;
            color: #ff7b7b;
        }
        .logout-link {
            margin-top: auto;
            color: #dc3545;
        }
        .main-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 30px;
        }
        .banner {
            background: linear-gradient(90deg, #ffcccc, #d0e1fd);
            height: 180px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        .red-section {
            background-color: #d94141;
            color: white;
            padding: 30px;
            border-radius: 8px;
        }
        .red-section h3 {
            margin-top: 0;
            font-size: 18px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 10px;
        }
        .red-section p {
            font-size: 14px;
            line-height: 1.6;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <sidebar>
        <div class="logo-area">ProMusic</div>
        <a href="curso.html" class="menu-link active">Inicio</a>
        <a href="material.html" class="menu-link">Material</a>
        <a href="presentacion.html" class="menu-link">Presentación</a>
        <a href="index.html" class="menu-link logout-link">Cerrar Sesión</a>
    </sidebar>

    <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vSYNdVlpUhBEmh44_vyioimJUbb3Sg3wWF4UgvjbswzMNnh05Aok07WooPMIuaepg/pubembed?start=true&loop=false&delayms=3000" frameborder="0" width="1280" height="749" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
</body>
</html>
